project_id = "handoffcheck"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:5174"
additional_redirect_urls = ["http://127.0.0.1:5174/auth/callback", "http://localhost:5174/auth/callback"]

[storage]
enabled = true
file_size_limit = "5MB"

[functions.handoff-api]
# The function verifies the current user through Auth itself, including new
# signing-key projects. The Gmail callback instead verifies single-use state and
# PKCE, then binds the Google identity to the initiating authenticated author.
verify_jwt = false

[functions.workspace-bridge]
# Signed outbound Apps Script calls; HMAC and database nonce verification are mandatory.
verify_jwt = false

[functions.automation-worker]
# Private scheduler calls must pass HMAC verification and nonce replay checks.
verify_jwt = false
