name: Release Windows installer
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main, such as v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}
  windows:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Validate tag format
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Use a version tag such as v0.1.0.' }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release revision
        shell: pwsh
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release tag must belong to main.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'The tag must match package.json version.' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npm run typecheck
      - run: npm run desktop:package
      - name: Record installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/HandoffCheck-*-setup.exe
          if ($installer.Count -ne 1) { throw 'Expected exactly one installer.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: |
            release/HandoffCheck-*-setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer
          path: release
      - name: Publish pilot release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS.txt
          cd ..
          gh release create "$RELEASE_TAG" release/HandoffCheck-*-setup.exe release/SHA256SUMS.txt --verify-tag --prerelease --title "HandoffCheck $RELEASE_TAG — Windows pilot" --notes-file "doc/releases/$RELEASE_TAG.md"
