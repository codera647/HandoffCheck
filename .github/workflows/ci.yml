name: Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://dpwzjmqvsqifbgspoylc.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_OwNeZrT5S9kAfH2TYas5Yg_bPYFV755
      VITE_ENABLE_DEMO: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx --yes deno@2.9.6 check --frozen --config supabase/functions/handoff-api/deno.json supabase/functions/handoff-api/index.ts
      - run: npx --yes deno@2.9.6 check --frozen --config supabase/functions/automation-worker/deno.json supabase/functions/automation-worker/index.ts
      - run: npm run test:desktop
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
